name: Country City Service CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'country-city-service/**' # 🎯 Ne se déclenche QUE si du code change dans ce dossier
  pull_request:
    branches: [ main, master ]
    paths:
      - 'country-city-service/**'

jobs:
  country-city-service-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./country-city-service

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Service Tests (Unit & Integration)
      run: mvn clean test

    - name: Log in to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Service Image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: ./country-city-service
        file: ./country-city-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/country-city-service:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/country-city-service:${{ github.sha }}
